<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#100c0b" />
  <meta name="description" content="A cinematic procedural Three.js tribute to the Battle of Gallipoli, 1915." />
  <title>Gallipoli 1915 — The Narrows</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #efe7d5;
      --muted: #b9ad98;
      --ember: #d26f3c;
      --glass: rgba(16, 12, 11, .56);
      --line: rgba(239, 231, 213, .22);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #100c0b; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    #app { position: fixed; inset: 0; }
    .grain {
      position: fixed; inset: -50%; z-index: 3; pointer-events: none; opacity: .055;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.72'/%3E%3C/svg%3E");
      animation: grain .25s steps(2) infinite;
    }
    @keyframes grain { 0%{transform:translate(0)} 25%{transform:translate(2%,-3%)} 50%{transform:translate(-3%,2%)} 75%{transform:translate(3%,3%)} 100%{transform:translate(-2%,-2%)} }
    .vignette { position: fixed; inset: 0; z-index: 2; pointer-events: none; background: radial-gradient(circle at 52% 42%, transparent 36%, rgba(7,5,5,.2) 67%, rgba(7,5,5,.72) 115%); }
    header { position: fixed; z-index: 4; top: 0; left: 0; right: 0; padding: clamp(20px, 4vw, 56px); display: flex; align-items: flex-start; justify-content: space-between; pointer-events: none; }
    .eyebrow { display: flex; align-items: center; gap: 11px; font-size: 10px; font-weight: 700; letter-spacing: .28em; text-transform: uppercase; color: var(--muted); }
    .eyebrow::before { content:""; width: 34px; height: 1px; background: var(--ember); box-shadow: 0 0 12px var(--ember); }
    h1 { margin: 12px 0 0; font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(34px, 6vw, 78px); line-height: .88; letter-spacing: -.055em; text-shadow: 0 5px 28px rgba(0,0,0,.55); }
    h1 span { display: block; margin-top: .24em; font-family: inherit; font-style: italic; color: #d4c3a3; font-size: .42em; letter-spacing: .02em; }
    .year { font-family: Georgia, serif; font-size: clamp(17px, 2vw, 28px); color: #d9cbb5; border-bottom: 1px solid var(--line); padding: 0 0 10px 28px; }
    footer { position: fixed; z-index: 4; left: 0; right: 0; bottom: 0; padding: clamp(20px, 3vw, 42px) clamp(20px, 4vw, 56px); display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none; }
    .caption { max-width: 410px; padding: 14px 17px; border-left: 1px solid var(--ember); background: linear-gradient(90deg, var(--glass), transparent); backdrop-filter: blur(5px); }
    .caption strong { display: block; margin-bottom: 5px; font-size: 11px; letter-spacing: .19em; text-transform: uppercase; }
    .caption p { margin: 0; color: var(--muted); font-family: Georgia, serif; font-size: 13px; line-height: 1.55; }
    .credit { text-align: right; font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: rgba(239,231,213,.56); }
    .credit b { display: block; color: var(--ink); font-size: 10px; margin-bottom: 5px; }
    .hint { position: fixed; z-index: 4; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; color: rgba(239,231,213,.62); font-size: 9px; letter-spacing: .16em; text-transform: uppercase; pointer-events: none; transition: opacity .8s; }
    .hint i { width: 16px; height: 25px; border: 1px solid rgba(239,231,213,.35); border-radius: 9px; position: relative; }
    .hint i::after { content:""; position:absolute; left:50%; top:5px; width:2px; height:5px; border-radius:2px; background:var(--ember); transform:translateX(-50%); animation: scroll 1.8s infinite; }
    @keyframes scroll { 0%{opacity:0;transform:translate(-50%,0)} 35%{opacity:1} 100%{opacity:0;transform:translate(-50%,8px)} }
    .loading { position: fixed; z-index: 10; inset: 0; display: grid; place-items: center; background: #100c0b; transition: opacity 1.1s ease, visibility 1.1s; }
    .loading.hidden { opacity: 0; visibility: hidden; }
    .loader { text-align: center; font: 10px/1.5 ui-sans-serif, system-ui; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); }
    .loader::after { content:""; display:block; width:110px; height:1px; margin-top:14px; background:linear-gradient(90deg,transparent,var(--ember),transparent); animation:pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { transform:scaleX(.45); opacity:.35; } }
    .noscript { position: fixed; z-index: 20; inset: 0; display:grid; place-items:center; padding:30px; text-align:center; background:#100c0b; }
    @media (max-width: 680px) {
      header { padding-top: max(20px, env(safe-area-inset-top)); }
      .year { padding-left: 10px; }
      .caption { max-width: 75vw; }
      .hint { display: none; }
      footer { padding-bottom: max(18px, env(safe-area-inset-bottom)); }
    }
    @media (prefers-reduced-motion: reduce) {
      .grain, .hint i::after, .loader::after { animation: none; }
    }
  </style>
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/"}}
  </script>
</head>
<body>
  <div id="app" aria-label="Interactive 3D scene of the Gallipoli peninsula at dawn"></div>
  <div class="vignette"></div><div class="grain"></div>
  <div class="loading" id="loading"><div class="loader">Entering the Dardanelles</div></div>
  <header>
    <div><div class="eyebrow">The Narrows · Gallipoli</div><h1>Çanakkale<span>A landscape remembers.</span></h1></div>
    <div class="year">1915</div>
  </header>
  <footer>
    <div class="caption"><strong>Before the cliffs</strong><p>Warships move through smoke toward the peninsula. Above them, the memorial stands beyond time—silent, watchful, enduring.</p></div>
    <div class="credit"><b>Build by GPT 5.6</b>Procedural WebGL Experience</div>
  </footer>
  <div class="hint" id="hint"><i></i>Drag to take control</div>
  <noscript><div class="noscript">This WebGL experience requires JavaScript.</div></noscript>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const app = document.querySelector('#app');
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x160f10);
    scene.fog = new THREE.FogExp2(0x55463f, 0.0135);

    const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.1, 430);
    camera.position.set(-92, 28, 62);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    app.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(35, 9, -7);
    controls.enableDamping = true;
    controls.dampingFactor = 0.045;
    controls.minDistance = 18;
    controls.maxDistance = 155;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.enabled = true;

    let cinematic = !reducedMotion;
    const stopCinema = () => {
      cinematic = false;
      document.querySelector('#hint').style.opacity = '0';
    };
    renderer.domElement.addEventListener('pointerdown', stopCinema, { once: true });
    renderer.domElement.addEventListener('wheel', stopCinema, { once: true, passive: true });

    // Deterministic procedural noise keeps the coastline reproducible.
    const fract = x => x - Math.floor(x);
    const hash = (x, z) => fract(Math.sin(x * 127.1 + z * 311.7) * 43758.5453);
    const smoothNoise = (x, z) => {
      const ix = Math.floor(x), iz = Math.floor(z), fx = x - ix, fz = z - iz;
      const ux = fx * fx * (3 - 2 * fx), uz = fz * fz * (3 - 2 * fz);
      return THREE.MathUtils.lerp(THREE.MathUtils.lerp(hash(ix,iz), hash(ix+1,iz), ux), THREE.MathUtils.lerp(hash(ix,iz+1), hash(ix+1,iz+1), ux), uz);
    };
    const fbm = (x, z) => {
      let v = 0, a = .55, f = 1;
      for (let i = 0; i < 5; i++) { v += a * smoothNoise(x*f, z*f); f *= 2.03; a *= .48; }
      return v;
    };
    const terrainHeight = (x, z) => {
      const coast = THREE.MathUtils.smoothstep(x, -7, 18);
      const ridges = fbm(x*.035, z*.042) * 17 + Math.sin(z*.055 + x*.018) * 2.2;
      const cliff = THREE.MathUtils.smoothstep(x, 2, 28) * 9;
      return coast * (2.2 + ridges + cliff) - (1 - coast) * 1.6;
    };

    function makeTerrain() {
      const geo = new THREE.PlaneGeometry(135, 148, 150, 145);
      geo.rotateX(-Math.PI/2);
      geo.translate(54, 0, 0);
      const p = geo.attributes.position;
      const colors = [];
      const low = new THREE.Color(0x403c2e), high = new THREE.Color(0x78684c), rock = new THREE.Color(0x665347);
      for (let i=0; i<p.count; i++) {
        const x=p.getX(i), z=p.getZ(i), y=terrainHeight(x,z);
        p.setY(i,y);
        const slopeMix = THREE.MathUtils.clamp((y-5)/25 + hash(x,z)*.16,0,1);
        const c = low.clone().lerp(high,slopeMix).lerp(rock, Math.max(0, .34-fbm(x*.08,z*.08))*.7);
        colors.push(c.r,c.g,c.b);
      }
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors,3));
      geo.computeVertexNormals();
      const mat = new THREE.MeshStandardMaterial({ vertexColors:true, roughness:.96, metalness:.02 });
      const mesh = new THREE.Mesh(geo,mat);
      mesh.receiveShadow=true; mesh.castShadow=true;
      return mesh;
    }
    scene.add(makeTerrain());

    // Custom GLSL sea: displaced vertices, moving wave normals and sunset glints.
    const seaUniforms = { uTime:{value:0}, uSun:{value:new THREE.Vector3(-.42,.32,-.2).normalize()} };
    const sea = new THREE.Mesh(new THREE.PlaneGeometry(125,180,110,120), new THREE.ShaderMaterial({
      uniforms: seaUniforms, fog:true,
      vertexShader: `
        uniform float uTime; varying vec3 vWorld; varying float vWave;
        #include <fog_pars_vertex>
        void main(){
          vec3 p=position;
          float w=sin(p.x*.19+uTime*.72)*.32 + sin(p.y*.11-uTime*.5)*.24 + sin((p.x+p.y)*.045+uTime*.3)*.5;
          p.z+=w; vWave=w;
          vec4 world=modelMatrix*vec4(p,1.); vWorld=world.xyz;
          vec4 mvPosition=viewMatrix*world; gl_Position=projectionMatrix*mvPosition;
          #include <fog_vertex>
        }`,
      fragmentShader: `
        uniform float uTime; uniform vec3 uSun; varying vec3 vWorld; varying float vWave;
        #include <common>
        #include <fog_pars_fragment>
        void main(){
          vec3 dx=dFdx(vWorld), dy=dFdy(vWorld); vec3 n=normalize(cross(dx,dy));
          vec3 viewDir=normalize(cameraPosition-vWorld);
          float fres=pow(1.-max(dot(n,viewDir),0.),3.);
          float glitter=pow(max(dot(reflect(-uSun,n),viewDir),0.),42.)*(.5+.5*sin(vWorld.x*3.+vWorld.z*2.));
          vec3 deep=vec3(.055,.105,.12), horizon=vec3(.24,.19,.17);
          vec3 color=mix(deep,horizon,fres*.7+vWave*.09)+vec3(1.,.39,.14)*glitter*1.7;
          gl_FragColor=vec4(color,1.);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
          #include <fog_fragment>
        }`
    }));
    sea.rotation.x=-Math.PI/2; sea.position.set(-57,-.25,0); sea.receiveShadow=true; scene.add(sea);

    // Dawn dome with a warm horizon.
    const sky = new THREE.Mesh(new THREE.SphereGeometry(260,32,18), new THREE.ShaderMaterial({
      side:THREE.BackSide, depthWrite:false,
      vertexShader:`varying vec3 vP; void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
      fragmentShader:`varying vec3 vP; void main(){float h=normalize(vP).y; vec3 low=vec3(.47,.20,.13); vec3 mid=vec3(.16,.11,.14); vec3 high=vec3(.025,.025,.05); vec3 c=mix(low,mid,smoothstep(-.08,.32,h)); c=mix(c,high,smoothstep(.28,.86,h)); gl_FragColor=vec4(c,1.);}`
    }));
    scene.add(sky);

    const hemi = new THREE.HemisphereLight(0x8fa2b2,0x2b1711,.7); scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xffa05f,4.3); sun.position.set(-70,58,-46); sun.castShadow=true;
    sun.shadow.mapSize.set(2048,2048); sun.shadow.camera.left=-95; sun.shadow.camera.right=95; sun.shadow.camera.top=80; sun.shadow.camera.bottom=-80;
    sun.shadow.camera.near=1; sun.shadow.camera.far=220; sun.shadow.bias=-.00025; scene.add(sun);
    const rim = new THREE.DirectionalLight(0x7187a2,1.1); rim.position.set(55,34,75); scene.add(rim);

    const sunDisc = new THREE.Mesh(new THREE.CircleGeometry(8,48), new THREE.MeshBasicMaterial({color:0xff9a55, fog:false}));
    sunDisc.position.set(-165,57,-95); sunDisc.lookAt(camera.position); scene.add(sunDisc);

    const stone = new THREE.MeshStandardMaterial({color:0x857d71,roughness:.83,metalness:.03});
    const darkStone = new THREE.MeshStandardMaterial({color:0x4b4741,roughness:.95});
    function box(w,h,d,mat=stone){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.castShadow=m.receiveShadow=true; return m; }

    function createMemorial() {
      const g=new THREE.Group(); const x=62,z=-19, ground=terrainHeight(x,z); g.position.set(x,ground,z);
      const plinth=box(19,1.4,16,darkStone); plinth.position.y=.7; g.add(plinth);
      [[-6,-4.7],[6,-4.7],[-6,4.7],[6,4.7]].forEach(([px,pz])=>{
        const foot=box(4.2,1.1,4.2,darkStone); foot.position.set(px,1.8,pz); g.add(foot);
        const col=box(3.5,15,3.5); col.position.set(px,9.7,pz); g.add(col);
      });
      const crown=box(17,3.2,14); crown.position.y=18.55; g.add(crown);
      const inset=box(8.2,1.2,14.2,darkStone); inset.position.set(0,17.75,0); g.add(inset);
      const flagMat=new THREE.MeshStandardMaterial({color:0x8f1f1d,roughness:.8});
      const flag=box(5.8,.12,3.8,flagMat); flag.rotation.x=Math.PI/2; flag.position.set(0,20.18,0); g.add(flag);
      g.scale.setScalar(.92); scene.add(g);
      const beacon=new THREE.PointLight(0xff8b49,2.8,38,2); beacon.position.set(x,ground+16,z); scene.add(beacon);
    }
    createMemorial();

    function createFort() {
      const g=new THREE.Group(), x=29,z=31, y=terrainHeight(x,z); g.position.set(x,y,z); g.rotation.y=-.18;
      for(let i=0;i<6;i++){ const wall=box(8,4.8,3.8,darkStone); wall.position.set(i*7.5,2.4,0); g.add(wall); }
      for(let i=0;i<7;i++){ const merlon=box(2.8,1.8,4,darkStone); merlon.position.set(i*7.5-3.5,5.7,0); g.add(merlon); }
      scene.add(g);
    }
    createFort();

    const hullMat=new THREE.MeshStandardMaterial({color:0x30383a,roughness:.7,metalness:.45});
    const deckMat=new THREE.MeshStandardMaterial({color:0x66605a,roughness:.8});
    function createWarship(x,z,s=.8) {
      const g=new THREE.Group(); g.position.set(x,.7,z); g.scale.setScalar(s);
      const hull=new THREE.Mesh(new THREE.CylinderGeometry(1.3,2.8,19,5,1),hullMat); hull.rotation.z=Math.PI/2; hull.scale.z=.74; hull.castShadow=true; g.add(hull);
      const deck=box(11,.7,3.8,deckMat); deck.position.y=1.5; g.add(deck);
      const bridge=box(3.3,2.7,2.7,hullMat); bridge.position.set(1,3.1,0); g.add(bridge);
      const tower=box(1.1,3.2,1.2,hullMat); tower.position.set(1,6,0); g.add(tower);
      const mast=new THREE.Mesh(new THREE.CylinderGeometry(.08,.12,8,6),deckMat); mast.position.set(-1.3,7,0); mast.castShadow=true; g.add(mast);
      [-4.2,5].forEach(px=>{ const turret=new THREE.Mesh(new THREE.CylinderGeometry(1,1.2,.8,8),hullMat); turret.position.set(px,2.35,0); g.add(turret); const gun=new THREE.Mesh(new THREE.CylinderGeometry(.12,.15,4,6),hullMat); gun.rotation.z=Math.PI/2; gun.position.set(px-1.7,2.55,0); g.add(gun); });
      g.rotation.y=-.08; scene.add(g); return g;
    }
    const ships=[createWarship(-48,-29,.82),createWarship(-67,12,.64),createWarship(-34,39,.48)];

    function makeSoftTexture() {
      const c=document.createElement('canvas'); c.width=c.height=64; const ctx=c.getContext('2d');
      const gr=ctx.createRadialGradient(32,32,2,32,32,31); gr.addColorStop(0,'rgba(255,255,255,.9)'); gr.addColorStop(.25,'rgba(255,255,255,.46)'); gr.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=gr; ctx.fillRect(0,0,64,64); return new THREE.CanvasTexture(c);
    }
    const soft=makeSoftTexture();
    function createParticles(count, color, size, zone) {
      const pos=new Float32Array(count*3), seed=new Float32Array(count);
      for(let i=0;i<count;i++){ pos[i*3]=zone.x+(Math.random()-.5)*zone.w; pos[i*3+1]=zone.y+Math.random()*zone.h; pos[i*3+2]=zone.z+(Math.random()-.5)*zone.d; seed[i]=Math.random(); }
      const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.BufferAttribute(pos,3)); geo.setAttribute('seed',new THREE.BufferAttribute(seed,1));
      const mat=new THREE.PointsMaterial({color,size,map:soft,transparent:true,opacity:.32,depthWrite:false,blending:THREE.NormalBlending,sizeAttenuation:true});
      const points=new THREE.Points(geo,mat); scene.add(points); return points;
    }
    const smoke=createParticles(115,0x5e5752,9,{x:11,y:2,z:0,w:82,h:27,d:125});
    const dust=createParticles(180,0xc6a779,.55,{x:20,y:2,z:0,w:105,h:26,d:140});

    const flashes=[];
    for(let i=0;i<5;i++){
      const mat=new THREE.SpriteMaterial({map:soft,color:0xff8c3d,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false});
      const sp=new THREE.Sprite(mat); const x=5+Math.random()*58,z=-58+Math.random()*116; sp.position.set(x,terrainHeight(x,z)+2,z); sp.scale.setScalar(1); sp.userData={phase:Math.random()*8,rate:.4+Math.random()*.4}; scene.add(sp); flashes.push(sp);
    }

    const clock=new THREE.Clock();
    const startCam=new THREE.Vector3(-92,28,62), endCam=new THREE.Vector3(-18,23,31);
    const startTarget=new THREE.Vector3(-10,5,-3), endTarget=new THREE.Vector3(54,13,-15);
    function animate() {
      requestAnimationFrame(animate);
      const dt=Math.min(clock.getDelta(),.033), t=clock.elapsedTime;
      seaUniforms.uTime.value=t;
      ships.forEach((s,i)=>{ s.position.x+=dt*(.36+i*.08); s.position.y=.72+Math.sin(t*.7+i)*.15; });
      const sp=smoke.geometry.attributes.position;
      for(let i=0;i<sp.count;i++){ let y=sp.getY(i)+dt*(.45+(i%7)*.025); let x=sp.getX(i)+dt*.12; if(y>31){y=1+(i%5);x-=3;} sp.setXYZ(i,x,y,sp.getZ(i)+Math.sin(t*.08+i)*.002); } sp.needsUpdate=true;
      dust.rotation.y=t*.006;
      flashes.forEach(f=>{ const wave=Math.sin(t*f.userData.rate+f.userData.phase); const a=Math.pow(Math.max(0,wave-.985)/.015,2); f.material.opacity=a*.95; const sc=2+a*12; f.scale.set(sc,sc,1); });
      if(cinematic){
        const u=(Math.sin(t*.075-Math.PI/2)+1)/2;
        const e=u*u*(3-2*u);
        camera.position.lerpVectors(startCam,endCam,e);
        controls.target.lerpVectors(startTarget,endTarget,e);
        camera.position.y+=Math.sin(t*.13)*.7;
      }
      controls.update();
      sunDisc.lookAt(camera.position);
      renderer.render(scene,camera);
    }

    addEventListener('resize',()=>{
      camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio,1.8)); renderer.setSize(innerWidth,innerHeight);
    },{passive:true});
    addEventListener('visibilitychange',()=>{ if(document.hidden) clock.stop(); else clock.start(); });
    renderer.domElement.addEventListener('webglcontextlost',e=>{ e.preventDefault(); document.querySelector('.loader').textContent='WebGL context paused'; });
    renderer.domElement.addEventListener('webglcontextrestored',()=>location.reload());

    requestAnimationFrame(()=>document.querySelector('#loading').classList.add('hidden'));
    animate();
  </script>
</body>
</html>
